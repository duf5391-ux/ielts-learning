<section id="sentence-learning" class="st-library">
  <div class="st-heading"><div><p class="st-kicker">SENTENCE NOTEBOOK</p><h2>我的句子本</h2></div><button type="button" data-open-sentence>翻译一句话</button></div>
  <p>在正文或自己的作文中选中一句话，点击「翻译句子」。保留有用的译文，也可以修改后收藏。</p>
  <label class="st-search">搜索句子<input id="sentence-search" type="search" placeholder="搜索原句或译文" /></label>
  <p id="sentence-count" class="st-muted" role="status"></p><div id="sentence-list"></div>
  <textarea hidden aria-hidden="true" id="sentence-store" data-save="sentence-collection-v1"></textarea>
</section>
<!--/SELECTION-TOOLS:records-->
